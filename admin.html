<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyeCon Admin</title>
<link rel="icon" type="image/png" href="assets/sprites/piko.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f0eb; --card:#fcf7ef; --line:#c8e6da; --teal:#2f7a70; --ink:#3b172e; --ink-2:#5a6f6a; --muted:#7b8a86;
    --bar:#7555af; --bar-soft:#e7e1f4; --grid:#e3ece8; --good:#1f6b45; --good-bg:#e0f5e8; --bad:#b02a5c; --bad-bg:#fde8ef;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1d1a22; --card:#27232d; --line:#3a4a46; --teal:#7fd0c3; --ink:#f3ecf2; --ink-2:#c5cfcc; --muted:#9aa7a3;
      --bar:#b49af0; --bar-soft:#3a3248; --grid:#34313b; --good:#8fe0ae; --good-bg:#21392c; --bad:#ff9cc0; --bad-bg:#3d2230; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.45 'Nunito',system-ui,sans-serif;}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:var(--card);border-bottom:2px solid var(--line);}
  header img{height:40px}
  header h1{margin:0;font:800 24px 'Baloo 2',sans-serif;color:var(--teal);flex:1}
  header small{color:var(--ink-2)}
  main{max-width:1200px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:24px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 24px}
  h2{margin:0 0 4px;font:800 22px 'Baloo 2',sans-serif}
  .sub{margin:0 0 16px;color:var(--ink-2);font-size:15px}
  button,.btn{font:800 16px 'Baloo 2',sans-serif;padding:8px 18px;border-radius:999px;border:2px solid #77b9af;background:#94d9cf;color:#183745;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
  /* Login */
  .login{max-width:380px;margin:10vh auto;text-align:center;display:grid;gap:12px}
  .login img{width:96px;margin:0 auto;clip-path:inset(15% 0 0 0)}
  .login input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#3b172e;font:700 16px 'Nunito',sans-serif}
  .err{color:var(--bad);min-height:1.4em;margin:0}
  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
  .tile b{display:block;font:800 34px/1.1 'Baloo 2',sans-serif;color:var(--ink)}
  .tile span{color:var(--ink-2);font-size:14px}
  /* Bar charts: one hue (single series → no legend; the title names it) */
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
  .bars{display:grid;gap:10px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 56px;align-items:center;gap:10px;font-size:14px}
  .bar-row .name{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{position:relative;height:18px;border-left:2px solid var(--grid)}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px;transition:filter .15s}
  .bar-row:hover .bar-fill{filter:brightness(1.12)}
  .bar-row .val{color:var(--ink);font-weight:800;text-align:right}
  .empty{color:var(--muted);font-style:italic}
  /* Daily activity columns */
  .cols{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:2px solid var(--grid);padding-top:8px}
  .col{flex:1;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .col:hover{filter:brightness(1.12)}
  .col-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
  /* Tooltip */
  #tip{position:fixed;pointer-events:none;z-index:10;background:#183745;color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .1s;max-width:260px}
  /* Table */
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font:800 13px 'Nunito',sans-serif;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
  th[aria-sort] ::after{content:''}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:13px}
  .pill.hard{background:var(--bad-bg);color:var(--bad)}
  .pill.easy{background:var(--good-bg);color:var(--good)}
  .row-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}
  .picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .picker button{background:transparent;color:var(--ink);padding:6px 14px;font-size:15px}
  .picker button[aria-pressed="true"]{background:var(--bar);border-color:var(--bar);color:#fff}
  .tiles.small .tile b{font-size:28px}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin:16px 0}
  .dist-row{grid-template-columns:110px 1fr 56px}
  tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--bar-soft)}
  .tabs{display:flex;gap:8px;margin-right:auto}
  .tabs button{background:transparent;color:var(--ink);padding:6px 16px}
  .tabs button[aria-current]{background:var(--bar);border-color:var(--bar);color:#fff}
  header h1{flex:none}
  .text-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .text-tools input[type=search]{flex:1;min-width:200px;padding:8px 14px;border:2px solid var(--line);border-radius:999px;background:#fff;color:#3b172e;font:700 15px 'Nunito',sans-serif}
  .tx-main #items{max-width:900px;margin:0 auto}
  .tx-n{opacity:.55;font-size:12px;margin-left:4px}
  .text-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--grid)}
  .text-item:first-child{border-top:0}
  .text-item header{all:unset;grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
  .text-item code{font-size:12px;color:var(--muted)}
  .text-item .note{color:var(--ink-2);font-size:14px}
  .text-item textarea{width:100%;min-height:84px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:#3b172e;font:600 15px/1.45 'Nunito',sans-serif;resize:vertical}
  .text-item textarea:focus-visible{outline:3px solid var(--bar);outline-offset:1px}
  .text-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .text-actions button{font-size:14px;padding:4px 14px}
  .badge{font:800 12px 'Nunito',sans-serif;padding:2px 10px;border-radius:999px;background:var(--grid);color:var(--ink-2)}
  .badge.draft{background:#fde9b8;color:#7a4b00}
  .badge.live{background:var(--good-bg);color:var(--good)}
  .ph{background:#ede4fb;color:#5b2fa8;border-radius:4px;padding:0 3px;font-weight:800}
  /* Previews in the game's own styles */
  .pv-piko{display:flex;align-items:flex-end;gap:10px}
  .pv-piko .pv-panel{flex:1;background:#fcf7ef;border:3px solid #2f7a70;border-radius:16px;padding:10px 14px;color:#3b172e;font:700 15px/1.4 'Nunito',sans-serif}
  .pv-piko .pv-panel b{display:block;font:800 12px 'Baloo 2',sans-serif;letter-spacing:.1em;color:#2f7a70}
  .pv-piko img{width:56px;clip-path:inset(15% 0 0 0)}
  .pv-mail{background:#fcf7ef;border:2px solid #77b9af;border-radius:14px;padding:12px 14px;color:#3b172e;font:600 14px/1.5 'Nunito',sans-serif;white-space:pre-line;max-height:240px;overflow:auto}
  .pv-task{background:#fff;border:2px solid #e3ece8;border-left:6px solid #2f7a70;border-radius:12px;padding:10px 12px;color:#3b172e;font:700 15px/1.4 'Nunito',sans-serif}
  .publish-bar{position:sticky;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;margin-top:16px;border-radius:999px;background:var(--card);border:2px solid var(--bar);box-shadow:0 6px 18px #0002}
  @media (max-width:760px){.text-item{grid-template-columns:1fr}}
  /* Piko timeline */
  .sections{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .sections button{background:transparent;color:var(--ink);padding:5px 12px;font-size:14px}
  .sections button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
  .tl{display:grid;gap:0;max-width:820px;margin:0 auto}
  .sections,#text-play-row{justify-content:center}
  .tl-step{border:2px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px}
  .tl-step.action{border-color:#7656b3}
  .tl-line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin:6px 0}
  .tl-line img{width:40px;clip-path:inset(15% 0 0 0);margin-top:6px}
  .tl-line textarea{width:100%;min-height:56px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fcf7ef;color:#3b172e;font:700 15px/1.45 'Nunito',sans-serif;resize:vertical}
  .tl-line textarea.main{border-color:#2f7a70;border-width:3px}
  .tl-line.added textarea{border-style:dashed;background:#fbf8ff}
  .tl-line .mini{display:flex;gap:4px;margin-top:4px}
  .tl-line .mini button{font-size:12px;padding:2px 10px}
  .tl-cue{display:flex;align-items:center;gap:8px;margin:6px 0 6px 24px;padding:6px 12px;border-left:3px dashed var(--muted);color:var(--ink-2);font-size:14px;font-style:italic}
  .tl-cue.action{border-left-color:var(--bar);color:var(--bar);font-weight:800;font-style:normal}
  .tl-gap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
  .tl-gap .tl-cue{margin:0}
  .tx-head{text-align:center;max-width:760px;margin:0 auto 16px}
  .tx-head .sub{margin:4px 0 8px}
  .tx-notice{display:inline-flex;align-items:center;gap:10px;margin:0;padding:6px 8px 6px 14px;border-radius:999px;background:#fde9b8;color:#7a4b00;font-weight:700;font-size:14px}
  .tx-notice button{padding:4px 14px;font-size:14px}
  .tx-toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin:0 0 20px}
  .seg{display:inline-flex;padding:4px;border:2px solid var(--line);border-radius:999px;background:var(--bg);gap:2px}
  .seg button{border:0;background:transparent;color:var(--ink);padding:6px 14px;font-size:15px}
  .seg button span{opacity:.6;font-size:13px;margin-left:2px}
  .seg button[aria-pressed="true"]{background:var(--bar);color:#fff}
  .seg button[aria-pressed="true"] span{opacity:.85}
  .tx-toolbar input[type=search]{width:min(320px,100%);padding:8px 16px;border:2px solid var(--line);border-radius:999px;background:#fff;color:#3b172e;font:700 15px 'Nunito',sans-serif}
  .tx-split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
  .tx-sections{position:sticky;top:12px;display:grid;gap:4px}
  .tx-sections p{margin:12px 0 4px;font:800 12px 'Nunito',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tx-sections p:first-child{margin-top:0}
  .tx-sections button{text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 12px;border-radius:12px;font-size:15px}
  .tx-sections button:hover{background:var(--bar-soft)}
  .tx-sections button[aria-pressed="true"]{background:var(--teal);color:#fff}
  .tx-mainhead{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:820px;margin:0 auto 12px}
  .tx-mainhead h3{margin:0;font:800 22px 'Baloo 2',sans-serif}
  .tx-key{color:var(--bar);font-weight:800}
  @media (max-width:800px){.tx-split{grid-template-columns:1fr}.tx-sections{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.tx-sections p{grid-column:1/-1}}
  .tl-add{font-size:13px!important;padding:3px 12px!important;background:transparent!important;color:var(--ink-2)!important;border-style:dashed!important}
  .tl-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tl-head code{font-size:12px;color:var(--muted)}
  .tl-skip{font-size:13px;color:var(--ink-2);display:flex;gap:4px;align-items:center;margin-left:auto}
  /* Play preview: the real game, 1920×1080, scaled to fit */
  .pv-frame{position:relative;width:min(1100px,94vw,calc((100vh - 170px) * 16 / 9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0008;background:#000}
  .pv-frame iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
  .pv-click{position:absolute;inset:0;cursor:pointer}
  .pv-frame .pv-count{position:absolute;left:12px;top:10px;padding:4px 10px;border-radius:999px;background:#0009;color:#fff;font-size:13px;pointer-events:none}
  .pv-caption{max-width:min(1100px,94vw);padding:8px 16px;border-radius:999px;background:#fff3d6;color:#4a2391;font:800 15px 'Nunito',sans-serif;text-align:center}
  .pv-caption b{color:#7656b3}
  /* (old mock scene styles) */
  .stagepv{position:relative;width:min(1100px,94vw);aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0008;cursor:pointer;
    background:#4fb3e8 url('assets/wallpapers/wallpaper-1.png') center/cover;font-family:'Nunito',sans-serif;}
  .stagepv.editor{background:#f4f0eb;}
  .stagepv.editor::before{content:'';position:absolute;left:4%;right:4%;top:9%;bottom:9%;border:2px solid #c8e6da;border-radius:14px;
    background:#fff linear-gradient(#e6eef0 1px,transparent 1px) 0 0/16px 16px,#fff linear-gradient(90deg,#e6eef0 1px,transparent 1px) 0 0/16px 16px;}
  .stagepv.mail{background:#f4f0eb;}
  .stagepv.mail::before{content:'';position:absolute;left:22%;right:6%;top:12%;bottom:12%;border:3px solid #77b9af;border-radius:20px;background:#fcf7ef;}
  .stagepv .pv-taskbar{position:absolute;left:0;right:0;bottom:0;height:7%;background:#b6e1da}
  .stagepv .pv-dim{position:absolute;inset:0;background:#22182699;display:grid;place-items:center;}
  .stagepv .pv-dim{align-content:center;gap:14px}
  .stagepv .pv-card{width:320px;padding:20px;border:3px solid #77b9af;border-radius:26px;background:#fcf7ef;display:grid;gap:10px;justify-items:center}
  .stagepv .pv-card img{width:80px;clip-path:inset(15% 0 0 0)}
  .stagepv .pv-card h3{margin:0;font:800 22px 'Baloo 2',sans-serif;color:#3b172e}
  .stagepv .pv-input{width:100%;padding:10px;border:2px solid #a5d6cc;border-radius:14px;background:#fff;color:#999;text-align:center;font-weight:700}
  .stagepv .pv-ok{width:100%;padding:8px;border-radius:999px;background:#94d9cf;color:#fff;text-align:center;font:800 18px 'Baloo 2',sans-serif}
  .stagepv .pv-action{padding:14px 22px;border-radius:16px;background:#fff3d6;border:3px solid #7656b3;color:#4a2391;font:800 18px 'Baloo 2',sans-serif;max-width:70%;text-align:center}
  .stagepv .pv-bubble{position:absolute;right:3%;bottom:11%;display:flex;align-items:flex-end;gap:12px;max-width:62%}
  .stagepv .pv-bubble .panel{background:#fcf7ef;border:4px solid #2f7a70;border-radius:22px;padding:16px 20px 10px;min-width:280px;box-shadow:0 10px 0 #3a2e3929}
  .stagepv .pv-bubble .panel b{display:block;font:800 13px 'Baloo 2',sans-serif;letter-spacing:.1em;color:#1f6b60;margin-bottom:6px}
  .stagepv .pv-bubble .panel p{margin:0;font:700 20px/1.45 'Nunito',sans-serif;color:#3b172e}
  .stagepv .pv-bubble .panel small{display:block;margin-top:10px;text-align:center;color:#6b6f7a;font-size:13px}
  .stagepv .pv-bubble img{width:150px;filter:drop-shadow(0 6px 6px #0003)}
  .stagepv .pv-count{position:absolute;left:12px;top:10px;padding:4px 10px;border-radius:999px;background:#0007;color:#fff;font-size:13px}
  .player{position:fixed;inset:0;z-index:20;background:#183745e6;display:grid;place-items:center;gap:12px;align-content:center}
  .player-nav{display:flex;gap:10px}
  /* Play preview (old) */
  .player{position:fixed;inset:0;z-index:20;background:#183745cc;display:grid;place-items:center}
  .player-box{width:min(640px,92vw);background:var(--card);border-radius:24px;padding:24px;display:grid;gap:16px}
  .player-box .pv-piko .pv-panel{font-size:18px;min-height:90px}
  .player-cue{padding:14px;border:2px dashed #7656b3;border-radius:14px;color:#5b2fa8;font-weight:800;text-align:center}
  .player-nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
  /* Fun, minimal stats */
  .fun-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .fun-tile{position:relative;padding:18px 20px;border-radius:22px;background:var(--c);color:#123b54;box-shadow:0 6px 0 #0000001a;overflow:hidden}
  .fun-tile .fe{position:absolute;right:12px;top:8px;font-size:36px;opacity:.9;transform:rotate(8deg)}
  .fun-tile b{display:block;font:800 40px/1 'Baloo 2',sans-serif}
  .fun-tile span:last-child{font-weight:800;font-size:15px;opacity:.8}
  .fun-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .fun-head h2{margin:0}
  .lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .lv{all:unset;cursor:pointer;position:relative;display:grid;gap:6px;padding:16px;border:2px solid var(--line);border-radius:20px;background:var(--bg);transition:transform .15s, box-shadow .15s}
  .lv:hover,.lv:focus-visible{transform:translateY(-3px);box-shadow:0 8px 0 #0000001a}
  .lv:focus-visible{outline:3px solid var(--bar)}
  .lv-ava{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:24px;background:#fff;border:2px solid var(--line)}
  .lv-ava img{width:100%;height:100%;object-fit:cover}
  .lv b{font:800 16px 'Baloo 2',sans-serif;color:var(--ink)}
  .lv-mood{font-weight:800;font-size:14px;color:var(--ink-2)}
  .lv-big{font:800 30px/1 'Baloo 2',sans-serif;color:var(--ink)}
  .lv-big small{font:700 13px 'Nunito',sans-serif;color:var(--ink-2)}
  .lv-chips{display:flex;flex-wrap:wrap;gap:6px}
  .lv-chips i{font-style:normal;font-weight:800;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .lv-bar{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--bar) var(--p),var(--grid) var(--p))}
  .lv-empty{opacity:.6}
  .mini-cols{display:flex;align-items:flex-end;gap:10px;height:150px;overflow-x:auto;padding-bottom:4px}
  .mini-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:26px}
  .mini-col i{display:block;width:22px;border-radius:8px 8px 4px 4px;background:var(--bar)}
  .mini-col small{font-size:11px;color:var(--muted)}
  .fun-more summary{cursor:pointer;list-style:none}
  .fun-more summary::-webkit-details-marker{display:none}
  .fun-more summary::before{content:'▸ ';color:var(--bar)}
  .fun-more[open] summary::before{content:'▾ '}
  .fun-more[open] summary{margin-bottom:12px}
  .loading{text-align:center;color:var(--ink-2);padding:40px}
  @media (max-width:600px){.bar-row{grid-template-columns:100px 1fr 48px}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header><img src="assets/sprites/logo-eyecon.png" alt="EyeCon"><h1>Admin dashboard</h1><nav class="tabs" id="tabs" hidden><button data-tab="stats" aria-current="page">Statistics</button><button data-tab="text">Dialogue &amp; text</button></nav><small id="who"></small><button class="ghost" id="signout" hidden>Sign out</button></header>
<main id="app"><p class="loading">Loading…</p></main>
<div id="tip" role="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/text.js"></script>
<script src="js/level-edits.js"></script>
<script src="js/levels.js"></script>
<script src="js/piko.js"></script>
<script src="js/mail.js"></script>
<script src="js/dialogue-flow.js"></script>
<script>
(() => {
  const cfg = window.EC_SUPABASE;
  const sb = window.supabase.createClient(cfg.url, cfg.publishableKey, { auth:{ storageKey:'eyecon-admin-auth' } }); // separate from the player session
  const app = document.getElementById('app');
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Admins sign in with a username; Supabase needs an email, so map it.
  const toEmail = u => u.includes('@') ? u : `${u.trim().toLowerCase()}@admins.eyecon.local`;
  const levelName = id => { const l = (window.EC_LEVELS || []).find(l => l.id === id); return l ? `${l.levelNumber}. ${l.clientName}` : id; };
  const levelNum = id => (window.EC_LEVELS || []).find(l => l.id === id)?.levelNumber ?? 99;

  // ── Tooltip ──
  const tip = document.getElementById('tip');
  document.addEventListener('pointermove', e => {
    const t = e.target.closest('[data-tip]');
    if(!t){ tip.style.opacity = 0; return; }
    tip.textContent = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });

  function showLogin(message = ''){
    app.innerHTML = `<form class="card login" id="login"><img src="assets/sprites/piko.png" alt=""><h2>Admin sign-in</h2>
      <input name="u" autocomplete="username" placeholder="Username" required aria-label="Username">
      <input name="p" type="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
      <button type="submit">Sign in</button><p class="err" role="alert">${esc(message)}</p></form>`;
    document.getElementById('login').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button'); btn.disabled = true;
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(f.u.value), password: f.p.value });
      btn.disabled = false;
      if(error) return f.querySelector('.err').textContent = 'Wrong username or password.';
      boot();
    });
  }

  async function boot(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return showLogin();
    const { data:username } = await sb.rpc('my_admin_username');
    if(!username){ await sb.auth.signOut(); return showLogin('This account is not an admin.'); }
    document.getElementById('who').textContent = `Signed in as ${username}`;
    const out = document.getElementById('signout'); out.hidden = false;
    out.onclick = async () => { await sb.auth.signOut(); location.reload(); };
    const tabs = document.getElementById('tabs'); tabs.hidden = false;
    tabs.onclick = e => { const b = e.target.closest('[data-tab]'); if(!b) return; tabs.querySelectorAll('button').forEach(x => x.toggleAttribute('aria-current', x === b)); b.dataset.tab === 'text' ? showText() : boot(); };
    if(tabs.querySelector('[aria-current]')?.dataset.tab === 'text') return showText();
    app.innerHTML = '<p class="loading">Loading statistics…</p>';
    const [ov, lv, daily] = await Promise.all([sb.rpc('admin_overview'), sb.rpc('admin_level_stats'), sb.rpc('admin_daily_activity')]);
    const err = ov.error || lv.error || daily.error;
    if(err){ app.innerHTML = `<div class="card"><h2>Couldn’t load statistics</h2><p class="err">${esc(err.message)}</p><p class="sub">Have the migrations 0002 and 0003 been run in the Supabase SQL editor?</p><button id="retry">Retry</button></div>`; document.getElementById('retry').onclick = boot; return; }
    render(ov.data?.[0] || {}, (lv.data || []).sort((a, b) => levelNum(a.level_id) - levelNum(b.level_id)), daily.data || []);
  }

  // Horizontal bars: one hue, value labelled at the end, hover for details.
  function bars(rows, value, fmt, detail){
    const vals = rows.map(value).filter(v => v != null && !isNaN(v));
    if(!vals.length) return '<p class="empty">No data yet.</p>';
    const max = Math.max(...vals) || 1;
    return `<div class="bars">${rows.map(r => {
      const v = value(r);
      return `<div class="bar-row" data-tip="${esc(detail(r))}"><span class="name">${esc(levelName(r.level_id))}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${v == null ? 0 : v / max * 100}%"></div></div><span class="val">${v == null ? '–' : fmt(v)}</span></div>`;
    }).join('')}</div>`;
  }

  function render(o, levels, daily){
    const pct = (a, b) => b ? Math.round(a / b * 100) : null;
    const firstTryRate = r => pct(+r.first_try_approved, +r.approved_players);
    // Struggle score: more resubmits and more time → harder. Ranked within this data set.
    const ranked = [...levels].filter(r => r.avg_submissions != null)
      .sort((a, b) => (+b.avg_resubmits - +a.avg_resubmits) || (+b.median_active_min - +a.median_active_min));
    const hard = new Set(ranked.slice(0, 2).map(r => r.level_id)), easy = new Set(ranked.slice(-2).map(r => r.level_id));
    const totalFirst = levels.reduce((s, r) => s + +r.first_try_approved, 0), totalOk = levels.reduce((s, r) => s + +r.approved_players, 0);

    const ftr = pct(totalFirst, totalOk);
    const tiles = [
      ['🎮', o.players ?? 0, 'players', '#f9d985'],
      ['🔥', o.active_7d ?? 0, 'played this week', '#f8c5c5'],
      ['📨', o.submissions ?? 0, 'designs sent', '#d8f3f1'],
      ['🎯', ftr == null ? '–' : ftr + '%', 'nailed it first try', '#ede4fb'],
      ['⏱️', (o.total_active_hours ?? 0) + 'h', 'spent designing', '#fff2dd'],
    ];
    // Level cards: one glance per level. Mood = how players did.
    // Fixed thresholds so the mood means the same thing with 1 player or 100.
    const mood = r => { const f = firstTryRate(r), re = +r.avg_resubmits;
      return r.approved_players == 0 ? ['😴', 'Not finished yet']
        : re >= 1.5 || (f != null && f < 40) ? ['😵‍💫', 'Players struggled']
        : (f ?? 0) >= 70 && re < 0.5 ? ['😎', 'Breezy'] : ['🙂', 'Going fine']; };
    const allLv = (window.EC_LEVELS || []).filter(l => l.levelNumber <= 7).sort((a, b) => a.levelNumber - b.levelNumber);
    const byId = Object.fromEntries(levels.map(r => [r.level_id, r]));
    const card = l => {
      const r = byId[l.id];
      if(!r) return `<button class="lv lv-empty" data-level="${esc(l.id)}"><span class="lv-ava">${l.avatarEmoji || '✉'}</span><b>${esc(l.levelNumber + '. ' + l.clientName)}</b><span class="lv-mood">💤 No plays yet</span></button>`;
      const [face, say] = mood(r), f = firstTryRate(r);
      return `<button class="lv" data-level="${esc(l.id)}" title="Click for every player on this level">
        <span class="lv-ava">${l.avatarEmoji || '✉'}</span><b>${esc(l.levelNumber + '. ' + l.clientName)}</b>
        <span class="lv-mood">${face} ${say}</span>
        <span class="lv-big">${r.median_active_min == null ? '–' : (+r.median_active_min).toFixed(1)}<small> min to finish</small></span>
        <span class="lv-chips"><i title="Players who opened it">👀 ${r.players}</i><i title="“Fix again” rounds per player">🔁 ${r.avg_resubmits ?? '–'}</i><i title="Approved on the first try">🎯 ${f == null ? '–' : f + '%'}</i><i title="Hints per player">💡 ${r.avg_hints ?? 0}</i></span>
        <span class="lv-bar" style="--p:${f ?? 0}%"></span></button>`;
    };
    // Activity: fixed-width bars so a single day doesn't fill the whole chart.
    const maxDay = Math.max(1, ...daily.map(d => +d.submissions));

    app.innerHTML = `
      <section class="fun-tiles" aria-label="Overview">${tiles.map(([e, v, l, c]) => `<div class="fun-tile" style="--c:${c}"><span class="fe">${e}</span><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</section>

      <section class="card"><div class="fun-head"><h2>How each level is going</h2><span class="sub" style="margin:0">Tap a level for every player’s run</span></div>
        <div class="lv-grid">${allLv.map(card).join('')}</div></section>

      <section class="card"><div class="fun-head"><h2>Designs sent per day</h2><span class="sub" style="margin:0">last 30 days</span></div>
        ${daily.length ? `<div class="mini-cols">${daily.map(d => `<div class="mini-col" data-tip="${esc(d.day)}: ${d.submissions} sent by ${d.players} player${d.players == 1 ? '' : 's'}"><i style="height:${Math.max(6, +d.submissions / maxDay * 100)}%"></i><small>${esc(String(d.day).slice(5))}</small></div>`).join('')}</div>` : '<p class="empty">No designs sent yet.</p>'}
      </section>

      <details class="card fun-more"><summary><h2 style="display:inline">All the numbers</h2> <span class="sub">table · CSV</span></summary>
<p class="sub">Full numbers per level. Click a column to sort. The two hardest and easiest levels are tagged.</p>
        <div class="row-actions"><button id="csv">Download CSV</button><button class="ghost" id="refresh">Refresh</button></div>
        <div class="table-wrap"><table id="tbl"><thead><tr>
          <th data-k="name">Level</th><th data-k="players">Opened</th><th data-k="approved_players">Approved</th><th data-k="first_try_approved">First try</th>
          <th data-k="avg_submissions">Avg sends</th><th data-k="avg_resubmits">Avg resubmits</th><th data-k="median_active_min">Median min</th>
          <th data-k="avg_hints">Hints</th><th data-k="abandoned">Abandoned</th><th data-k="avg_first_stars">1st stars</th><th>Verdict</th>
        </tr></thead><tbody></tbody></table></div>
        ${levels.length ? '' : '<p class="empty">No play data yet. Numbers appear once players open and submit levels.</p>'}
      </details>

      <section class="card" id="detail"><h2>Level details</h2><p class="sub">Pick a level to see each player: how long they took, how many times they resent it, and how it ended.</p>
        <div class="picker" role="group" aria-label="Level">${(window.EC_LEVELS || []).filter(l => l.levelNumber <= 7).sort((a, b) => a.levelNumber - b.levelNumber)
          .map(l => `<button type="button" data-level="${esc(l.id)}" aria-pressed="false">${esc(l.levelNumber + '. ' + l.clientName)}</button>`).join('')}</div>
        <div id="detail-body"><p class="empty">Choose a level above, or click a row in the table.</p></div>
      </section>`;

    let sortKey = 'num', dir = 1;
    const rows = levels.map(r => Object.assign({ name: levelName(r.level_id), num: levelNum(r.level_id) }, r));
    const drawTable = () => {
      const s = [...rows].sort((a, b) => { const x = a[sortKey], y = b[sortKey]; return (typeof x === 'string' ? x.localeCompare(y) : (+x || 0) - (+y || 0)) * dir; });
      document.querySelector('#tbl tbody').innerHTML = s.map(r => `<tr class="clickable" data-level="${esc(r.level_id)}" title="Show players for this level"><td>${esc(r.name)}</td><td>${r.players}</td><td>${r.approved_players}</td><td>${r.first_try_approved}</td>
        <td>${r.avg_submissions ?? '–'}</td><td>${r.avg_resubmits ?? '–'}</td><td>${r.median_active_min ?? '–'}</td><td>${r.avg_hints ?? 0}</td><td>${r.abandoned}</td><td>${r.avg_first_stars ?? '–'}</td>
        <td>${hard.has(r.level_id) ? '<span class="pill hard">Struggled</span>' : easy.has(r.level_id) ? '<span class="pill easy">Easy</span>' : ''}</td></tr>`).join('');
    };
    document.querySelectorAll('#tbl th[data-k]').forEach(th => th.addEventListener('click', () => {
      dir = sortKey === th.dataset.k ? -dir : 1; sortKey = th.dataset.k; drawTable();
    }));
    drawTable();
    document.querySelector('#tbl tbody').addEventListener('click', e => { const tr = e.target.closest('tr[data-level]'); if(tr){ showDetail(tr.dataset.level); document.getElementById('detail').scrollIntoView({ behavior:'smooth' }); } });
    document.querySelectorAll('.picker button').forEach(b => b.addEventListener('click', () => showDetail(b.dataset.level)));
    document.querySelectorAll('.lv[data-level]').forEach(b => b.addEventListener('click', () => { showDetail(b.dataset.level); document.getElementById('detail').scrollIntoView({ behavior:'smooth' }); }));
    document.getElementById('refresh').onclick = boot;
    document.getElementById('csv').onclick = () => {
      const cols = ['level_id','name','players','approved_players','first_try_approved','avg_submissions','avg_resubmits','median_active_min','avg_hints','abandoned','avg_first_stars'];
      const csv = [cols.join(','), ...rows.map(r => cols.map(c => JSON.stringify(r[c] ?? '')).join(','))].join('\n');
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type:'text/csv' })), download: `eyecon-level-stats-${new Date().toISOString().slice(0,10)}.csv` });
      a.click(); URL.revokeObjectURL(a.href);
    };
  }

  // ── One level, one row per player ──
  async function showDetail(levelId){
    document.querySelectorAll('.picker button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === levelId)));
    const body = document.getElementById('detail-body');
    body.innerHTML = '<p class="loading">Loading players…</p>';
    const { data, error } = await sb.rpc('admin_level_detail', { p_level: levelId });
    if(error){ body.innerHTML = `<p class="err">${esc(error.message)}</p><p class="sub">Has migration 0004 been run?</p>`; return; }
    const rows = data || [];
    if(!rows.length){ body.innerHTML = '<p class="empty">Nobody has opened this level yet.</p>'; return; }
    const done = rows.filter(r => r.approved), sent = rows.filter(r => +r.submissions > 0);
    const median = a => { const v = a.filter(x => x != null).map(Number).sort((x, y) => x - y); if(!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
    const avg = a => a.length ? a.reduce((t, x) => t + Number(x || 0), 0) / a.length : null;
    const medMin = median(done.map(r => r.active_min));
    const tiles = [
      [rows.length, 'Players who opened it'],
      [done.length, 'Got it approved'],
      [done.length ? Math.round(done.filter(r => r.approved_attempt === 1).length / done.length * 100) + '%' : '–', 'Approved on the first try'],
      [medMin == null ? '–' : medMin.toFixed(1) + ' min', 'Median active time to finish'],
      [sent.length ? avg(sent.map(r => r.resubmits)).toFixed(2) : '–', 'Average resubmits'],
      [rows.reduce((t, r) => t + +r.abandoned, 0), 'Times left without sending'],
    ];
    const tries = [['1st try', r => r.approved_attempt === 1], ['2nd try', r => r.approved_attempt === 2], ['3rd try', r => r.approved_attempt === 3], ['4+ tries', r => r.approved_attempt >= 4], ['Not yet', r => !r.approved]]
      .map(([label, f]) => ({ label, n: rows.filter(f).length }));
    const bins = [['Under 2 min', 0, 2], ['2–5 min', 2, 5], ['5–10 min', 5, 10], ['10–20 min', 10, 20], ['20+ min', 20, Infinity]]
      .map(([label, lo, hi]) => ({ label, n: done.filter(r => +r.active_min >= lo && +r.active_min < hi).length }));
    const dist = items => { const max = Math.max(1, ...items.map(i => i.n)); return `<div class="bars">${items.map(i =>
      `<div class="bar-row dist-row" data-tip="${esc(i.label)}: ${i.n} player${i.n === 1 ? '' : 's'}"><span class="name">${esc(i.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${i.n / max * 100}%"></div></div><span class="val">${i.n}</span></div>`).join('')}</div>`; };
    const cols = [['player_name','Player'],['opened_at','Opened'],['submissions','Sends'],['resubmits','Resubmits'],['approved','Result'],['approved_attempt','Approved on'],['active_min','Active min'],['elapsed_min','Total min'],['hints','Hints'],['abandoned','Left'],['first_stars','1st stars'],['best_stars','Best stars']];
    const cell = (r, k) => k === 'opened_at' ? esc(r[k] ? new Date(r[k]).toLocaleString() : '–')
      : k === 'approved' ? (r.approved ? '<span class="pill easy">Approved</span>' : +r.submissions ? '<span class="pill hard">Fix again</span>' : '<span class="pill">Not sent</span>')
      : k === 'approved_attempt' ? (r[k] ? `try ${r[k]}` : '–') : esc(r[k] ?? '–');
    body.innerHTML = `<section class="tiles small">${tiles.map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</section>
      <div class="detail-grid">
        <div><h2>When it got approved</h2><p class="sub">Players by the submission that passed.</p>${dist(tries)}</div>
        <div><h2>How long it took</h2><p class="sub">Active minutes until approval (approved players only).</p>${done.length ? dist(bins) : '<p class="empty">No approvals yet.</p>'}</div>
      </div>
      <div class="row-actions"><button id="detail-csv">Download CSV</button></div>
      <div class="table-wrap"><table><thead><tr>${cols.map(([, h]) => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${cols.map(([k]) => `<td>${cell(r, k)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    document.getElementById('detail-csv').onclick = () => {
      const csv = [cols.map(c => c[0]).join(','), ...rows.map(r => cols.map(([k]) => JSON.stringify(r[k] ?? '')).join(','))].join('\n');
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type:'text/csv' })), download: `eyecon-${levelId}-players.csv` });
      a.click(); URL.revokeObjectURL(a.href);
    };
  }

  // ───────────── Dialogue & text editor ─────────────
  const AREAS = [['piko','Piko'],['emails','Emails'],['tasks','Tasks'],['feedback','Feedback'],['onboarding','Onboarding'],['ui','Other']];
  const SAMPLE = { name:'Alex', client:'Mayonnaisegee', page:'portfolio', better:'everything lines up neatly', gift:'we would love to send you a signed art print' };
  const fillSample = t => esc(t).replace(/\{(\w+)\}/g, (m, k) => `<span class="ph" title="{${k}}">${esc(SAMPLE[k] ?? '{' + k + '}')}</span>`).replace(/\\n/g, '\n');
  let textRows = {}, textArea = 'piko', textQuery = '';

  async function showText(){
    app.innerHTML = '<p class="loading">Loading text…</p>';
    const { data, error } = await sb.from('content_text').select('key, value, draft, updated_at');
    if(error){ app.innerHTML = `<div class="card"><h2>Couldn’t load text</h2><p class="err">${esc(error.message)}</p></div>`; return; }
    textRows = Object.fromEntries((data || []).map(r => [r.key, r]));
    drawText();
  }

  function preview(key, area, text){
    if(area === 'piko' || area === 'onboarding') return `<div class="pv-piko"><div class="pv-panel"><b>PIKO</b>${fillSample(text)}</div><img src="assets/sprites/piko.png" alt=""></div>`;
    if(area === 'tasks') return `<div class="pv-task">${fillSample(text)}</div>`;
    return `<div class="pv-mail">${fillSample(text)}</div>`;
  }

  function drawText(){
    const D = window.EC_TEXT.defaults;
    const keys = Object.keys(D).filter(k => D[k].area === textArea && (!textQuery || (k + ' ' + D[k].value + ' ' + (textRows[k]?.value || '') + ' ' + (D[k].note || '')).toLowerCase().includes(textQuery)));
    const drafts = Object.values(textRows).filter(r => r.draft != null).length;
    const missing = Object.keys(D).filter(k => !textRows[k]).length;
    app.innerHTML = `<section class="card">
      <div class="tx-head"><h2>Dialogue &amp; text</h2>
        <p class="sub">Edit what players read. <b>Save draft</b> keeps it private, <b>Publish</b> sends drafts to the game. <code>{name}</code>-style words are filled in automatically.</p>
        ${missing ? `<p class="tx-notice">⚠ ${missing} built-in line${missing === 1 ? '' : 's'} not in the database yet <button id="import">Import</button></p>` : ''}</div>
      <div class="tx-toolbar">
        <div class="seg" role="group" aria-label="Area">${AREAS.filter(([a]) => Object.values(D).some(d => d.area === a)).map(([a, l]) => `<button type="button" data-area="${a}" aria-pressed="${a === textArea}">${l} <span>${Object.values(D).filter(d => d.area === a).length}</span></button>`).join('')}</div>
        <input type="search" id="tq" placeholder="Search all text…" value="${esc(textQuery)}" aria-label="Search text"></div>
      ${textArea === 'piko' && !textQuery ? pikoTimeline() : groupedView(keys, k => {
        const row = textRows[k], current = row?.draft ?? row?.value ?? D[k].value;
        const badge = row?.draft != null ? '<span class="badge draft">Draft</span>' : row ? '<span class="badge live">Published</span>' : '<span class="badge">Built-in</span>';
        return `<article class="text-item" data-key="${esc(k)}"><header><b>${esc(labelFor(k))}</b>${badge}<code>${esc(k)}</code></header>
          <div><textarea aria-label="${esc(k)}">${esc(current.replace(/\\n/g, '\n'))}</textarea>
            <div class="text-actions"><button class="save">Save draft</button>${row?.draft != null ? '<button class="ghost discard">Discard draft</button>' : ''}${(row?.value ?? D[k].value) !== D[k].value ? '<button class="ghost reset">Reset to built-in</button>' : ''}</div></div>
          <div class="pv">${preview(k, D[k].area, current)}</div></article>`;
      })}
      <div class="publish-bar"><span>${drafts ? `<b>${drafts}</b> unpublished draft${drafts === 1 ? '' : 's'}` : 'Everything is published.'}</span><button id="publish" ${drafts ? '' : 'disabled'}>Publish ${drafts || ''}</button></div>
    </section>`;

    app.querySelectorAll('[data-area]').forEach(b => b.onclick = () => { textArea = b.dataset.area; textGroup = null; drawText(); });
    app.querySelectorAll('[data-group]').forEach(b => b.onclick = () => { textGroup = b.dataset.group; drawText(); });
    const tq = document.getElementById('tq');
    tq.oninput = () => { textQuery = tq.value.trim().toLowerCase(); const pos = tq.selectionStart; drawText(); const n = document.getElementById('tq'); n.focus(); n.setSelectionRange(pos, pos); };
    document.getElementById('import')?.addEventListener('click', importDefaults);
    document.getElementById('publish').onclick = async () => {
      const { data:n, error } = await sb.rpc('admin_publish_text');
      if(error) return alert(error.message);
      alert(`Published ${n} change${n === 1 ? '' : 's'}.`); showText();
    };
    if(textArea === 'piko' && !textQuery) bindTimeline();
    app.querySelectorAll('.text-item').forEach(item => {
      const key = item.dataset.key, ta = item.querySelector('textarea'), D0 = D[key];
      ta.oninput = () => { item.querySelector('.pv').innerHTML = preview(key, D0.area, ta.value); };
      const upsert = async fields => {
        const row = textRows[key];
        const { error } = await sb.from('content_text').upsert(Object.assign({ key, area: D0.area, note: D0.note, value: row?.value ?? D0.value }, fields));
        if(error) return alert(error.message);
        showText();
      };
      item.querySelector('.save').onclick = () => upsert({ draft: ta.value.replace(/\r?\n/g, '\n') });
      item.querySelector('.discard')?.addEventListener('click', () => upsert({ draft: null }));
      item.querySelector('.reset')?.addEventListener('click', () => upsert({ draft: D0.value }));
    });
  }

  // ───────────── Emails / Tasks / Feedback: grouped by client ─────────────
  let textGroup = null;
  const levelOf = k => {
    let m = k.match(/^level\.([^.]+)\./); if(m) return (window.EC_LEVELS || []).find(l => l.id === m[1]);
    m = k.match(/^mail\.gift\.(\w+)$/); if(m) return (window.EC_LEVELS || []).find(l => l.project === m[1] && l.levelNumber <= 7);
    return null;
  };
  const groupOf = k => { const l = levelOf(k); return l ? l.id : 'general'; };
  const GROUP_HINT = { emails:'Shared email wording (every client)', feedback:'Shared “fix again” email wording', tasks:'General', ui:'Buttons and hints' };
  // Friendly label per key instead of raw notes.
  function labelFor(k){
    const m = k.match(/\.task\.(\d+)\.(label|tip)$/); if(m) return `Task ${+m[1] + 1} · ${m[2] === 'tip' ? 'tip' : 'what to do'}`;
    const f = { emailSubject:'Email subject', emailPreview:'Inbox preview line', emailBody:'Email body' }[k.split('.').pop()]; if(f) return f;
    const rp = k.match(/\.reply\.(\w+)$/); if(rp) return { great:'Reply when it’s perfect (5★)', ok:'Reply when it’s approved', bad:'Reply when it needs fixing' }[rp[1]] || 'Client reply: ' + rp[1];
    if(k.startsWith('mail.gift.')) return 'Thank-you gift (approval email)';
    return window.EC_TEXT.defaults[k]?.note || k;
  }
  // Tasks read in order; email fields subject → preview → body.
  const order = k => { const t = k.match(/\.task\.(\d+)\.(label|tip)$/); if(t) return 100 + (+t[1]) * 2 + (t[2] === 'tip'); return ['emailSubject','emailPreview','emailBody'].indexOf(k.split('.').pop()) + 1 || 50; };
  function groupedView(keys, card){
    const groups = {};
    keys.forEach(k => (groups[groupOf(k)] = groups[groupOf(k)] || []).push(k));
    const ids = Object.keys(groups).sort((a, b) => (a === 'general') - (b === 'general') || ((levelOf('level.' + a + '.x')?.levelNumber || 0) - (levelOf('level.' + b + '.x')?.levelNumber || 0)));
    if(!ids.length) return '<p class="empty">Nothing here.</p>';
    if(textQuery) return `<div id="items" class="tx-flat">${keys.map(card).join('')}</div>`; // searching: everything that matches
    if(!groups[textGroup]) textGroup = ids[0];
    const name = id => { if(id === 'general') return GROUP_HINT[textArea] || 'General'; const l = levelOf('level.' + id + '.x'); return l ? `${l.levelNumber}. ${l.clientName}` : id; };
    const items = groups[textGroup].sort((a, b) => order(a) - order(b));
    return `<div class="tx-split"><nav class="tx-sections" aria-label="Client"><p>${textArea === 'tasks' ? 'Levels' : 'Clients'}</p>
        ${ids.map(id => `<button type="button" data-group="${esc(id)}" aria-pressed="${id === textGroup}">${esc(name(id))} <span class="tx-n">${groups[id].length}</span></button>`).join('')}</nav>
      <div class="tx-main"><div class="tx-mainhead"><div><h3>${esc(name(textGroup))}</h3><p class="sub" style="margin:0">${items.length} line${items.length === 1 ? '' : 's'}</p></div></div>
        <div id="items">${items.map(card).join('')}</div></div></div>`;
  }

  // ───────────── Piko: sections in play order ─────────────
  let textSection = (window.EC_FLOW || [])[0]?.id;
  const lineText = key => { const row = textRows[key], D = window.EC_TEXT.defaults[key]; return (row?.draft ?? row?.value ?? D?.value ?? '').replace(/\\n/g, '\n'); };
  const extrasOf = key => { const row = textRows[key + '#extra']; try{ const x = JSON.parse(row?.draft ?? row?.value ?? '{}'); return { before: x.before || [], after: x.after || [], skip: !!x.skip }; }catch(_){ return { before:[], after:[], skip:false }; } };
  const badgeFor = key => { const a = textRows[key], b = textRows[key + '#extra']; return (a?.draft != null || b?.draft != null) ? '<span class="badge draft">Draft</span>' : (a || b) ? '<span class="badge live">Published</span>' : '<span class="badge">Built-in</span>'; };

  function pikoTimeline(){
    const sec = window.EC_FLOW.find(f => f.id === textSection) || window.EC_FLOW[0];
    const steps = window.EC_FLOW_STEPS(sec);
    const added = (key, where, i, t) => `<div class="tl-line added" data-key="${esc(key)}" data-where="${where}" data-i="${i}"><img src="assets/sprites/piko.png" alt="">
      <div><textarea aria-label="Added line">${esc(t)}</textarea><div class="mini"><button class="ghost up" title="Move up">↑</button><button class="ghost down" title="Move down">↓</button><button class="ghost del">Remove</button><span class="badge">Added line</span></div></div></div>`;
    const GROUPS = [['First day', f => !/^lesson|basics|next-mail/.test(f.id)], ['Lessons', f => /^lesson/.test(f.id)], ['Later', f => /basics|next-mail/.test(f.id)]];
    return `<div class="tx-split"><nav class="tx-sections" aria-label="Section">${GROUPS.map(([g, test]) => `<p>${g}</p>` +
        window.EC_FLOW.filter(test).map(f => `<button type="button" data-section="${f.id}" aria-pressed="${f.id === sec.id}">${esc(f.title.replace(/^Lesson: /, ''))}</button>`).join('')).join('')}</nav>
      <div class="tx-main"><div class="tx-mainhead"><div><h3>${esc(sec.title)}</h3><p class="sub" style="margin:0">Lines in play order. <span class="tx-key">★ purple</span> = the player must do something.</p></div><button id="play">▶ Play preview</button></div>
      <div class="tl"><div class="tl-gap"><button class="tl-add" data-add="before" data-for="${esc(steps[0]?.key || '')}">+ add line before</button></div>${steps.map((st, idx) => {
        const x = extrasOf(st.key), talk = st.wait === 'click';
        return `<div class="tl-step ${talk ? '' : 'action'}" data-key="${esc(st.key)}">
          <div class="tl-head">${badgeFor(st.key)}<code>${esc(st.key)}</code>${talk ? `<label class="tl-skip"><input type="checkbox" class="skip" ${x.skip ? 'checked' : ''}> Skip this line</label>` : ''}</div>
          ${x.before.map((t, i) => added(st.key, 'before', i, t)).join('')}
          <div class="tl-line"><img src="assets/sprites/piko.png" alt=""><div><textarea class="main" aria-label="${esc(st.key)}">${esc(lineText(st.key))}</textarea></div></div>
          ${x.after.map((t, i) => added(st.key, 'after', i, t)).join('')}
          <div class="text-actions"><button class="save-step">Save draft</button></div>
        </div>
        <div class="tl-gap"><button class="tl-add" data-add="after" data-for="${esc(st.key)}">+ add line after${talk ? '' : ' (plays once the player has done it)'}</button>
          <div class="tl-cue ${talk ? '' : 'action'}">${talk ? '⤷' : '★'} ${esc(st.cue)}</div>
          ${steps[idx + 1] ? `<button class="tl-add" data-add="before" data-for="${esc(steps[idx + 1].key)}">+ add line before</button>` : ''}</div>`;
      }).join('')}</div></div></div>`;
  }

  function bindTimeline(){
    app.querySelectorAll('[data-section]').forEach(b => b.onclick = () => { textSection = b.dataset.section; drawText(); });
    document.getElementById('play').onclick = playPreview;
    app.querySelectorAll('.tl-step').forEach(stepEl => {
      const key = stepEl.dataset.key, D0 = window.EC_TEXT.defaults[key] || { area:'piko', note:'' };
      // Gather this step's current editor state (main text + added lines + skip).
      const collect = () => {
        const lines = where => [...stepEl.querySelectorAll(`.tl-line.added[data-where="${where}"] textarea`)].map(t => t.value.trim()).filter(Boolean);
        return { text: stepEl.querySelector('textarea.main').value.replace(/\r?\n/g, '\n'), extra: { before: lines('before'), after: lines('after'), skip: !!stepEl.querySelector('.skip')?.checked } };
      };
      const rerender = mutate => { // edit the added lines locally, then redraw this step
        const c = collect(); mutate(c.extra);
        textRows[key + '#extra'] = Object.assign({}, textRows[key + '#extra'], { draft: JSON.stringify(c.extra), _local: true });
        if(c.text !== lineText(key)) textRows[key] = Object.assign({}, textRows[key], { draft: c.text, _local: true });
        drawText();
      };
      app.querySelectorAll(`[data-add][data-for="${CSS.escape(key)}"]`).forEach(b => b.onclick = () => rerender(x => x[b.dataset.add].push(b.dataset.add === 'before' ? 'New line before.' : 'New line after.')));
      stepEl.querySelectorAll('.tl-line.added').forEach(l => {
        const where = l.dataset.where, i = +l.dataset.i;
        l.querySelector('.del').onclick = () => rerender(x => x[where].splice(i, 1));
        l.querySelector('.up').onclick = () => rerender(x => { if(i > 0) [x[where][i - 1], x[where][i]] = [x[where][i], x[where][i - 1]]; });
        l.querySelector('.down').onclick = () => rerender(x => { if(i < x[where].length - 1) [x[where][i + 1], x[where][i]] = [x[where][i], x[where][i + 1]]; });
      });
      stepEl.querySelector('.save-step').onclick = async () => {
        const c = collect(), rows = [];
        const base = (k, area, note, fallback) => ({ key:k, area, note, value: textRows[k]?.value ?? fallback });
        if(c.text !== (textRows[key]?.value ?? D0.value)) rows.push(Object.assign(base(key, D0.area, D0.note, D0.value), { draft: c.text }));
        const ex = JSON.stringify(c.extra), exPub = textRows[key + '#extra']?.value ?? '{}';
        if(ex !== exPub && !(ex === JSON.stringify({ before:[], after:[], skip:false }) && exPub === '{}')) rows.push(Object.assign(base(key + '#extra', 'piko', 'Added lines', '{}'), { draft: ex }));
        if(!rows.length) return alert('Nothing changed.');
        const { error } = await sb.from('content_text').upsert(rows);
        if(error) return alert(error.message);
        showText();
      };
    });
  }

  // ▶ Play preview: the REAL game in an iframe (?piko-preview), driven step by step,
  // so it shows exactly what the player sees: apps, mail, editor, highlights.
  function playPreview(){
    const sec = window.EC_FLOW.find(f => f.id === textSection);
    const seq = [];
    window.EC_FLOW_STEPS(sec).forEach(st => {
      const x = extrasOf(st.key), talk = st.wait === 'click', scene = st.scene || sec.scene || 'desktop';
      const base = { scene, top: st.top, left: st.left };
      x.before.forEach(t => seq.push(Object.assign({ t, talk: true }, base)));
      if(st.key === 'piko.askNameTitle'){ seq[seq.length - 1].card = lineText(st.key); return; } // the name card's title, shown with the question
      const main = Object.assign({ t: lineText(st.key), talk, target: st.target, cue: talk ? '' : st.cue }, base);
      if(talk){ if(!x.skip) seq.push(main); x.after.forEach(t => seq.push(Object.assign({ t, talk: true }, base))); }
      else { seq.push(main); x.after.forEach(t => seq.push(Object.assign({ t, talk: true }, base))); }
    });
    const fill = t => t.replace(/\\n/g, '\n').replace(/\{name\}/g, 'Alex').replace(/\{client\}/g, 'Mayonnaisegee');
    let i = 0, ready = false;
    const box = document.createElement('div'); box.className = 'player';
    box.innerHTML = `<div class="pv-frame" role="dialog" aria-label="Preview: ${esc(sec.title)}"><iframe id="pv-game" src="play.html?piko-preview" title="Game preview" tabindex="-1"></iframe>
        <div class="pv-click" id="pv-stage" title="Click to continue"></div><span class="pv-count"></span></div>
      <div class="pv-caption" id="pv-cap"></div>
      <div class="player-nav"><button class="ghost" id="pv-back">‹ Back</button><button id="pv-next">Next ›</button><button class="ghost" id="pv-close">Close</button></div>`;
    const frame = box.querySelector('#pv-game');
    // Local dev serves the game as index.html; production as play.html.
    if(location.hostname === '127.0.0.1' || location.hostname === 'localhost' || location.pathname.endsWith('.html')) frame.src = 'index.html?piko-preview';
    const fit = () => { const w = box.querySelector('.pv-frame').clientWidth; frame.style.transform = `scale(${w / 1920})`; };
    const draw = () => {
      const st = seq[i];
      box.querySelector('.pv-count').textContent = `${sec.title} · ${i + 1} / ${seq.length}`;
      box.querySelector('#pv-cap').innerHTML = st.cue ? `<b>★</b> ${esc(st.cue)}` : '⤷ Player clicks anywhere to continue';
      box.querySelector('#pv-back').disabled = i === 0;
      box.querySelector('#pv-next').textContent = i === seq.length - 1 ? 'Close' : 'Next ›';
      if(ready) frame.contentWindow.postMessage({ type:'piko-preview', scene: st.scene, text: fill(st.t), target: st.target, top: st.top, left: st.left, talk: st.talk, card: st.card && fill(st.card) }, '*');
    };
    const onMsg = e => { if(e.source === frame.contentWindow && e.data?.type === 'piko-preview-ready'){ ready = true; draw(); } };
    addEventListener('message', onMsg);
    const close = () => { box.remove(); removeEventListener('message', onMsg); removeEventListener('resize', fit); };
    box.querySelector('#pv-back').onclick = () => { if(i){ i--; draw(); } };
    box.querySelector('#pv-next').onclick = () => { if(i === seq.length - 1) return close(); i++; draw(); };
    box.querySelector('#pv-close').onclick = close;
    box.querySelector('#pv-stage').onclick = () => box.querySelector('#pv-next').click(); // click anywhere, like in the game
    box.addEventListener('click', e => { if(e.target === box) close(); });
    document.addEventListener('keydown', function k(e){ if(!box.isConnected) return document.removeEventListener('keydown', k); if(e.key === 'Escape') close(); if(e.key === 'ArrowRight') box.querySelector('#pv-next').click(); if(e.key === 'ArrowLeft') box.querySelector('#pv-back').click(); });
    document.body.appendChild(box); addEventListener('resize', fit); fit(); draw();
    box.querySelector('#pv-cap').textContent = 'Loading the game…';
  }

  // One-time: copy every built-in line into Supabase so it can be edited.
  async function importDefaults(){
    const D = window.EC_TEXT.defaults;
    const rows = Object.keys(D).filter(k => !textRows[k]).map(k => ({ key:k, area:D[k].area, note:D[k].note, value:D[k].value }));
    for(let i = 0; i < rows.length; i += 200){
      const { error } = await sb.from('content_text').upsert(rows.slice(i, i + 200), { onConflict:'key', ignoreDuplicates:true });
      if(error) return alert(error.message);
    }
    showText();
  }

  boot();
})();
</script>
</body>
